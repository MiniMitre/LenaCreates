<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" />
    <meta
      name="description"
      content="Explore original artwork and prints by Lena Creates."
    />
    <title>LenaCreates.art</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="index.html" aria-label="Lena Creates home"
        >lena<span>.</span>creates</a
      >
      <div class="header-right">
        <nav class="nav" aria-label="Main navigation">
          <a href="about/index.html">About</a>
          <a href="portfolio/index.html">Portfolio</a>
          <a href="shop/index.html">Purchase Prints</a>
          <a href="contact/index.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero gallery" id="gallery">
        <img
          class="gallery-image"
          src="images/image.jpg"
          alt="Floral paper collage artwork"
        />
      </section>
      <section class="hero" id="home">
        <div>
          <div class="eyebrow">Lena Creates</div>
          <h1>Art made with <em>heart</em></h1>
          <p class="hero-copy">
            Explore original artwork, learn more about the artist, or find a
            print to take home.
          </p>
          <a class="primary" href="portfolio/index.html"
            >Explore the portfolio <span aria-hidden="true">↗</span></a
          >
        </div>
        <div class="hero-art">
          <div class="frame">
            <div class="artwork">
              <img
                class="product-artwork"
                src="images/image.jpg"
                alt="Floral paper collage artwork"
              />
            </div>
            <div class="frame-caption">Floral paper collage</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a class="brand" href="index.html" aria-label="Lena Creates home"
        >lena<span>.</span>creates</a
      >
      <div class="footer-links">
        <a href="about/index.html">About</a>
        <a href="portfolio/index.html">Portfolio</a>
        <a href="shop/index.html">Purchase Prints</a>
        <a href="contact/index.html">Contact</a>
      </div>
      <span>Copyright notice goes here</span>
    </footer>
  </body>
</html>
