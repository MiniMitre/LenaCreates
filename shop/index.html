<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>Purchase Prints | LenaCreates.art</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="../index.html" aria-label="Lena Creates home"
        >LenaCreates<span class="brand-dot">.</span>art</a
      >
      <div class="header-right">
        <nav class="nav" aria-label="Main navigation">
          <a href="../about/index.html">About</a>
          <a href="../portfolio/index.html">Portfolio</a>
          <a href="index.html" aria-current="page">Purchase Prints</a>
          <a href="../contact/index.html">Contact</a>
        </nav>
        <a class="cart" id="cart-btn" href="../checkout/index.html">
          Bag (<span id="cart-count">0</span>)
        </a>
      </div>
    </header>

    <main>
      <section class="page-main shop-main" id="shop">
        <div class="page-heading shop-heading">
          <h1 class="page-title">PURCHASE PRINTS</h1>
        </div>
        <div class="shop-layout">
          <aside class="filter-sidebar" aria-label="Filter prints">
            <h2>Filter</h2>
            <div class="filters">
              <button class="filter active" type="button" data-filter="all">
                All Prints
              </button>
              <button class="filter" type="button" data-filter="small">
                A5 &amp; A6 prints
              </button>
              <button class="filter" type="button" data-filter="a4">
                A4 prints
              </button>
              <button class="filter" type="button" data-filter="cards">
                Greetings Cards
              </button>
            </div>
          </aside>
          <div class="shop-grid" id="prints"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-social">Links to social</span>
      <span>Copyright notice goes here</span>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="../store.js" defer></script>
    <script src="shop.js" defer></script>
    <script src="../script.js" defer></script>
  </body>
</html>
