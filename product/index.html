<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>Print | LenaCreates.art</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="../store.js" defer></script>
    <script src="product.js" defer></script>
    <script src="../script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="../index.html" aria-label="Lena Creates home"
        >LenaCreates<span class="brand-dot">.</span>art</a
      >
      <div class="header-right">
        <nav class="nav" aria-label="Main navigation">
          <a href="../about/index.html">About</a>
          <a href="../portfolio/index.html">Portfolio</a>
          <a href="../shop/index.html" aria-current="page">Purchase Prints</a>
          <a href="../contact/index.html">Contact</a>
        </nav>
        <a class="cart" id="cart-btn" href="../checkout/index.html">
          Bag (<span id="cart-count">0</span>)
        </a>
      </div>
    </header>
    <main class="page-main product-detail-main">
      <p><a href="../shop/index.html">← Back to prints</a></p>
      <p id="product-status" role="status" aria-live="polite"></p>
      <section id="product-detail" class="product-detail hidden">
        <div class="product-detail-image-wrap">
          <img id="product-image" class="product-detail-image" alt="" />
        </div>
        <div class="product-detail-info">
          <p id="product-description" class="product-meta"></p>
          <h1 id="product-name" class="page-title"></h1>
          <p id="product-price" class="product-detail-price"></p>
          <p id="product-availability" class="product-detail-availability"></p>
          <button id="add-to-cart" class="primary" type="button">
            Add to bag
          </button>
          <p><a href="../checkout/index.html">View bag</a></p>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
